name: Build and Release Universal Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release'
        required: true
        default: 'v0.1.8'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Universal Binary (Apple Silicon & Intel)
        run: |
          # Ensure the build script is executable
          chmod +x ./build.sh

          # --- Build ARM64 Slice ---
          echo "Building ARM64 slice using build.sh..."
          ./build.sh arm64
          mv bin/macintercom macintercom-arm64

          # --- Build x86_64 Slice ---
          echo "Building x86_64 slice using build.sh..."
          ./build.sh x86_64
          mv bin/macintercom macintercom-x86_64

          # --- Combine Universal Binary ---
          echo "Creating universal binary with lipo..."
          lipo -create -output macintercom macintercom-arm64 macintercom-x86_64
          lipo -info ./macintercom

          echo "Cleaning up temporary build artifacts..."
          rm -f macintercom-arm64 macintercom-x86_64
          rm -rf bin

      - name: Set Permissions and Code Sign
        run: |
          chmod +x ./macintercom
          codesign --force --options runtime --sign - ./macintercom

      - name: Zip Binary (Preserves Executable Permissions & macOS Metadata)
        run: |
          ditto -c -k macintercom macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip

      - name: Generate SHA256 Checksum
        run: |
          shasum -a 256 macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip > SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
