name: Build and Release Universal Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release'
        required: true
        default: 'v0.1.6'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Release
    runs-on: macos-latest

    steps:
	- name: Checkout Source Code
        uses: actions/checkout@v7

	- name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

	- name: Build Universal Binary (Apple Silicon & Intel)
        run: |
          swiftc -warnings-as-errors $(find . -name "*.swift") -target arm64-apple-macosx11.0 -O -o macintercom-arm64
          swiftc -warnings-as-errors $(find . -name "*.swift") -target x86_64-apple-macosx10.15 -O -o macintercom-x86_64
          lipo -create -output macintercom macintercom-arm64 macintercom-x86_64
          lipo -info ./macintercom

	- name: Set Permissions and Code Sign
	run: |
	  chmod +x ./macintercom
	  codesign --force --options runtime --sign - ./macintercom

	- name: Zip Binary (Preserves Executable Permissions)
        run: |
          zip macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip macintercom

	- name: Generate SHA256 Checksum
        run: |
          shasum -a 256 macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip > SHA256SUMS

	- name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
