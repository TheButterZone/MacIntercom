name: Build and Release Universal Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release'
        required: true
        default: 'v0.1.6'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Universal Binary (Apple Silicon & Intel)
        run: |
          echo "Preparing build environment..."
          mkdir -p Sources/WebRTCVAD

          # Create the rtc_FatalMessage implementation stub if it doesn't already exist
          if [ ! -f Sources/WebRTCVAD/rtc_stub.c ]; then
              cat << 'EOF' > Sources/WebRTCVAD/rtc_stub.c
          #include <stdio.h>
          #include <stdlib.h>

          void rtc_FatalMessage(const char* file, int line, const char* msg) {
              fprintf(stderr, "FATAL ERROR in %s:%d - %s\n", file, line, msg);
              abort();
          }
          EOF
          fi

          # --- Build ARM64 Slice ---
          echo "Compiling C sources for ARM64..."
          mkdir -p .build/arm64/vad .build/arm64/sp .build/arm64/stub
          
          clang -c -target arm64-apple-macosx11.0 Sources/WebRTCVAD/rtc_stub.c -o .build/arm64/stub/rtc_stub.o

          for cfile in Sources/WebRTCVAD/webrtc/common_audio/vad/*.c; do
              clang -c -target arm64-apple-macosx11.0 "$cfile" \
                -DWEBRTC_POSIX \
                -I Sources/WebRTCVAD \
                -o ".build/arm64/vad/$(basename "$cfile" .c).o"
          done

          for cfile in Sources/WebRTCVAD/webrtc/common_audio/signal_processing/*.c; do
              clang -c -target arm64-apple-macosx11.0 "$cfile" \
                -DWEBRTC_POSIX \
                -I Sources/WebRTCVAD \
                -o ".build/arm64/sp/$(basename "$cfile" .c).o"
          done

          echo "Compiling Swift files and linking ARM64 slice..."
          swiftc \
            Sources/*.swift \
            Sources/WebRTCVAD/WebRTCVAD.swift \
            .build/arm64/stub/*.o \
            .build/arm64/vad/*.o \
            .build/arm64/sp/*.o \
            -target arm64-apple-macosx11.0 \
            -import-objc-header Sources/MacIntercom-Bridging-Header.h \
            -I Sources/WebRTCVAD \
            -O -o macintercom-arm64

          # --- Build x86_64 Slice ---
          echo "Compiling C sources for x86_64..."
          mkdir -p .build/x86_64/vad .build/x86_64/sp .build/x86_64/stub
          
          clang -c -target x86_64-apple-macosx10.15 Sources/WebRTCVAD/rtc_stub.c -o .build/x86_64/stub/rtc_stub.o

          for cfile in Sources/WebRTCVAD/webrtc/common_audio/vad/*.c; do
              clang -c -target x86_64-apple-macosx10.15 "$cfile" \
                -DWEBRTC_POSIX \
                -I Sources/WebRTCVAD \
                -o ".build/x86_64/vad/$(basename "$cfile" .c).o"
          done

          for cfile in Sources/WebRTCVAD/webrtc/common_audio/signal_processing/*.c; do
              clang -c -target x86_64-apple-macosx10.15 "$cfile" \
                -DWEBRTC_POSIX \
                -I Sources/WebRTCVAD \
                -o ".build/x86_64/sp/$(basename "$cfile" .c).o"
          done

          echo "Compiling Swift files and linking x86_64 slice..."
          swiftc \
            Sources/*.swift \
            Sources/WebRTCVAD/WebRTCVAD.swift \
            .build/x86_64/stub/*.o \
            .build/x86_64/vad/*.o \
            .build/x86_64/sp/*.o \
            -target x86_64-apple-macosx10.15 \
            -import-objc-header Sources/MacIntercom-Bridging-Header.h \
            -I Sources/WebRTCVAD \
            -O -o macintercom-x86_64

          # --- Combine Slices ---
          echo "Creating universal binary with lipo..."
          lipo -create -output macintercom macintercom-arm64 macintercom-x86_64
          lipo -info ./macintercom

          echo "Cleaning up temporary build artifacts..."
          rm -rf .build macintercom-arm64 macintercom-x86_64

      - name: Set Permissions and Code Sign
        run: |
          chmod +x ./macintercom
          codesign --force --options runtime --sign - ./macintercom

      - name: Zip Binary (Preserves Executable Permissions)
        run: |
          zip macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip macintercom

      - name: Generate SHA256 Checksum
        run: |
          shasum -a 256 macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip > SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          files: |
            macintercom-macos-universal-${{ steps.vars.outputs.TAG }}.zip
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true